import java.util.spi.ToolProvider

plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id "com.github.breadmoirai.github-release" version "2.5.2"
    id "com.github.gmazzo.buildconfig" version "6.1.1"
    id "com.github.hierynomus.license" version "0.16.1"
}

group = 'com.clouds42'
version = '2.8.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}


configurations {
    providedCompile
    testCompileOnly.extendsFrom(providedCompile)
}

dependencies {
    def edtLocation = System.getenv('EDT_LOCATION')
    if (edtLocation == null) {
        def ringExecutable = 'ring.sh'
        if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            ringExecutable = 'ring.cmd'
        }
        def output = providers.exec {
            commandLine ringExecutable, 'edt@2021.1.5', 'locations', 'list'
        }.standardOutput.asText.get()
        edtLocation = output.trim().split("\n")[0].trim() + '/plugins/'
    }
    println 'EDT location: ' + edtLocation

    implementation 'info.picocli:picocli:4.7.7'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

    implementation 'org.slf4j:slf4j-api:2.0.19'
    implementation 'org.slf4j:slf4j-simple:2.0.19'

    implementation 'org.scala-sbt.ipcsocket:ipcsocket:1.8.0'

    implementation 'org.eclipse.emf:org.eclipse.emf.common:2.46.0'
    implementation 'org.eclipse.emf:org.eclipse.emf.ecore.xmi:2.41.0'
    implementation 'org.eclipse.emf:org.eclipse.emf.ecore.xcore.lib:1.8.0'

    implementation 'org.eclipse.platform:org.eclipse.osgi:3.24.300'

    implementation 'org.eclipse.platform:org.eclipse.core.runtime:3.35.0'
    implementation 'org.eclipse.platform:org.eclipse.osgi.services:3.12.300'
    implementation 'org.eclipse.platform:org.eclipse.equinox.common:3.21.0'


    implementation 'org.eclipse.jetty:jetty-client:12.1.13'

    implementation 'com.google.guava:guava:33.7.1-jre'

    implementation 'com.google.inject:guice:7.0.0'

    implementation('de.vandermeer:asciitable:0.3.2') {
        // ANTLR tool is not needed to render tables, it conflicts with bsl-parser ANTLR runtime
        exclude group: 'org.antlr', module: 'antlr4'
    }

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'io.github.1c-syntax:mdclasses:0.20.0'
    implementation 'io.github.1c-syntax:bsl-common-library:0.12.5'
    implementation 'io.github.1c-syntax:bsl-parser:0.39.0'

    providedCompile fileTree(edtLocation) { include 'com._1c.g5.v8.dt.debug.*.jar' }

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'org.xmlunit:xmlunit-core:2.14.0'
    testImplementation 'org.xmlunit:xmlunit-matchers:2.14.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
}

tasks.withType(JavaCompile) {
    sourceSets.main.compileClasspath += configurations.providedCompile
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
    options.encoding = 'UTF-8'
    options.release = 21
}

run {
    classpath += configurations.providedCompile
}

test {
    doFirst { systemProperty 'coverage41c.testClasspath', classpath.asPath }
    finalizedBy jacocoTestReport
    classpath += configurations.providedCompile
    useJUnitPlatform {
        excludeTags 'integration'
    }
    jvmArgs = ['--add-opens=java.base/java.net=ALL-UNNAMED']
    testLogging.showStandardStreams = true
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests requiring a local 1C installation and vrunner'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + configurations.providedCompile
    useJUnitPlatform {
        includeTags 'integration'
    }
}

startScripts {
  unixStartScriptGenerator.template = resources.text.fromFile(project.getRootDir().getAbsolutePath() + '/scripts/unixStartScript.txt')
  windowsStartScriptGenerator.template = resources.text.fromFile(project.getRootDir().getAbsolutePath() + '/scripts/windowsStartScript.txt')
}

def testEdtDiscovery = tasks.register('testEdtDiscovery', Exec) {
    dependsOn tasks.named('installDist')
    onlyIf { File.separator == '/' }
    commandLine 'sh', file('src/test/sh/edt-discovery.sh'),
            layout.buildDirectory.file('install/Coverage41C/bin/Coverage41C').get().asFile
    doFirst {
        environment 'JAVA_HOME', System.getProperty('java.home')
        args(configurations.providedCompile.files)
    }
}
tasks.named('check') { dependsOn testEdtDiscovery }

application {
    mainClass = 'com.clouds42.Coverage41C'
    applicationDefaultJvmArgs = ['--add-opens=java.base/java.net=ALL-UNNAMED']
}

jacocoTestReport {
    dependsOn test
}

// Derive the debugger API required by this build from compiled classes (including method bodies).
def edtClassList = tasks.register('generateEdtClassList') {
    def classes = tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }
    def manifest = layout.buildDirectory.file('generated/edt/required-classes.txt')
    def factoryManifest = layout.buildDirectory.file('generated/edt/required-factory-methods.txt')
    def memberManifest = layout.buildDirectory.file('generated/edt/required-members.txt')
    inputs.dir(classes)
    inputs.property('jdepsVersion', Runtime.version().toString())
    outputs.files(manifest, factoryManifest, memberManifest)
    doLast {
        def jdeps = ToolProvider.findFirst('jdeps').orElseThrow {
            new GradleException('Building the EDT class list requires jdeps from a JDK')
        }
        def listing = new StringWriter()
        def diagnostic = new StringWriter()
        int status = jdeps.run(new PrintWriter(listing), new PrintWriter(diagnostic),
                '-verbose:class', '-filter:none', classes.get().asFile.absolutePath)
        if (status != 0) {
            throw new GradleException("Cannot determine required EDT classes: ${diagnostic}")
        }
        def required = new TreeSet<String>()
        listing.toString().eachLine { line ->
            def match = line =~ /^\s*\S+\s+->\s+(com\._1c\.g5\.v8\.dt\.(?:internal\.)?debug\.[\w.$]+)\s/
            if (match.find()) {
                required.add(match.group(1))
            }
        }
        if (required.empty) {
            throw new GradleException('No EDT references found in the compiled application classes')
        }
        File output = manifest.get().asFile
        output.parentFile.mkdirs()
        output.setText(required.join('\n') + '\n', 'UTF-8')
        // Exact calls avoid resolving optional SDK methods while still rejecting missing used APIs.
        def javap = ToolProvider.findFirst('javap').orElseThrow {
            new GradleException('Building the EDT factory method list requires javap from a JDK')
        }
        def bytecode = new StringWriter()
        def javapErrors = new StringWriter()
        def arguments = ['-c', '-p', '-v'] + fileTree(classes.get().asFile) { include '**/*.class' }
                .files.collect { it.absolutePath }.sort()
        int javapStatus = javap.run(new PrintWriter(bytecode), new PrintWriter(javapErrors),
                arguments as String[])
        if (javapStatus != 0) {
            throw new GradleException("Cannot determine required EDT factory methods: ${javapErrors}")
        }
        def factories = new TreeSet<String>()
        def members = new TreeSet<String>()
        def handleInstructions = [getField: 'getfield', getStatic: 'getstatic', putField: 'putfield',
                                  putStatic: 'putstatic', invokeVirtual: 'invokevirtual',
                                  invokeInterface: 'invokeinterface', invokeStatic: 'invokestatic',
                                  invokeSpecial: 'invokespecial', newInvokeSpecial: 'newinvokespecial']
        String caller
        bytecode.toString().eachLine { line ->
            if (line.startsWith('Classfile ')) {
                caller = null
            }
            // The Classfile header can be a path or a URI. Use the name in the class itself.
            def className = line =~ /^\s*this_class:\s+#\d+\s+\/\/\s+(\S+)\s*$/
            if (className.find()) {
                caller = className.group(1).replace('/', '.')
            }
            def instruction = line =~ /^\s*\d+:\s+(invokevirtual|invokeinterface|invokestatic|invokespecial|getfield|getstatic|putfield|putstatic)\s+.*?\/\/\s+(?:InterfaceMethod|Method|Field) (\S+)$/
            def handle = line =~ /\bREF_(getField|getStatic|putField|putStatic|invokeVirtual|invokeInterface|invokeStatic|invokeSpecial|newInvokeSpecial) (\S+)\s*$/
            String opcode = null
            String reference = null
            if (instruction.find()) {
                opcode = instruction.group(1)
                reference = instruction.group(2)
            } else if (handle.find()) {
                opcode = handleInstructions[handle.group(1)]
                reference = handle.group(2)
            }
            if (reference != null) {
                def member = reference =~ /^(com\/_1c\/g5\/v8\/dt\/(?:internal\/)?debug\/[\w\/$]+)\.("?[^":]+"?):(\S+)$/
                if (member.matches()) {
                    if (caller == null) {
                        throw new GradleException("Cannot determine class for EDT member reference: ${reference}")
                    }
                    members.add("${opcode} ${member.group(1).replace('/', '.')} ${member.group(2).replace('"', '')} ${member.group(3)} ${caller}")
                }
            }
            def call = line =~ /(?:InterfaceMethod|Method|REF_invokeInterface|REF_invokeVirtual) (com\/_1c\/g5\/v8\/dt\/(?:internal\/)?debug\/[\w\/$]+Factory)\.(create[\w$]+):\(\)L([^;]+);/
            if (call.find()) {
                factories.add("${call.group(1).replace('/', '.')} ${call.group(2)} ${call.group(3).replace('/', '.')}")
            }
        }
        if (factories.empty) {
            throw new GradleException('No EDT factory calls found in the compiled application classes')
        }
        factoryManifest.get().asFile.setText(factories.join('\n') + '\n', 'UTF-8')
        if (members.empty) {
            throw new GradleException('No EDT member references found in the compiled application classes')
        }
        memberManifest.get().asFile.setText(members.join('\n') + '\n', 'UTF-8')
    }
}

tasks.named('jar', Jar) {
    from(edtClassList) { into 'META-INF/coverage41c' }
}

buildConfig {
    className("BuildConfig")
    packageName("com.clouds42")
    buildConfigField("String", "APP_VERSION", "\"${project.version}\"")
    buildConfigField("long", "BUILD_TIME", "${System.currentTimeMillis()}L")
}

githubRelease {
    token(findProperty("github.token") ?: "")
    owner = "proDOOMman"
    repo = "Coverage41C"
    targetCommitish = "master"
    releaseAssets.from(distZip.archiveFile)
    dryRun = false
}

license {
    header = rootProject.file("HEADER.txt")

    ext["year"] = "2020-" + Calendar.getInstance().get(Calendar.YEAR)
    ext["name"] = "Kosolapov Stanislav aka proDOOMman <prodoomman@gmail.com>"
    ext["project"] = "Coverage41C"
    exclude("**/*.properties")
    exclude("**/*.xml")
    exclude("**/*.json")
    exclude("**/*.bsl")
    exclude("**/*.os")
    exclude("**/*.txt")
    exclude("**/*.java.orig")
    exclude("**/*.impl")
    exclude("**/BuildConfig.java")
    strictCheck = true
    mapping("java", "SLASHSTAR_STYLE")
}
