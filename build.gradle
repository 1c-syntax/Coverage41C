plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id "com.github.breadmoirai.github-release" version "2.5.2"
    id "com.github.gmazzo.buildconfig" version "6.1.1"
    id "com.github.hierynomus.license" version "0.16.1"
}

group = 'com.clouds42'
version = '2.8.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}


configurations {
    providedCompile
}

dependencies {
    def edtLocation = System.getenv('EDT_LOCATION')
    if (edtLocation == null) {
        def ringExecutable = 'ring.sh'
        if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            ringExecutable = 'ring.cmd'
        }
        def output = providers.exec {
            commandLine ringExecutable, 'edt@2021.1.5', 'locations', 'list'
        }.standardOutput.asText.get()
        edtLocation = output.trim().split("\n")[0].trim() + '/plugins/'
    }
    println 'EDT location: ' + edtLocation

    implementation 'info.picocli:picocli:4.7.7'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

    implementation 'org.slf4j:slf4j-api:2.0.19'
    implementation 'org.slf4j:slf4j-simple:2.0.19'

    implementation 'org.scala-sbt.ipcsocket:ipcsocket:1.8.0'

    implementation 'org.eclipse.emf:org.eclipse.emf.common:2.46.0'
    implementation 'org.eclipse.emf:org.eclipse.emf.ecore.xmi:2.41.0'
    implementation 'org.eclipse.emf:org.eclipse.emf.ecore.xcore.lib:1.8.0'

    implementation 'org.eclipse.platform:org.eclipse.osgi:3.24.300'

    implementation 'org.eclipse.platform:org.eclipse.core.runtime:3.35.0'
    implementation 'org.eclipse.platform:org.eclipse.osgi.services:3.12.300'
    implementation 'org.eclipse.platform:org.eclipse.equinox.common:3.21.0'


    implementation 'org.eclipse.jetty:jetty-client:12.1.13'

    implementation 'com.google.guava:guava:33.7.1-jre'

    implementation 'com.google.inject:guice:7.0.0'

    implementation('de.vandermeer:asciitable:0.3.2') {
        // ANTLR tool is not needed to render tables, it conflicts with bsl-parser ANTLR runtime
        exclude group: 'org.antlr', module: 'antlr4'
    }

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'io.github.1c-syntax:mdclasses:0.20.0'
    implementation 'io.github.1c-syntax:bsl-common-library:0.12.5'
    implementation 'io.github.1c-syntax:bsl-parser:0.39.0'

    providedCompile fileTree(edtLocation) { include 'com._1c.g5.v8.dt.debug.*.jar' }

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'org.xmlunit:xmlunit-core:2.14.0'
    testImplementation 'org.xmlunit:xmlunit-matchers:2.14.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-core:2.22.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
}

tasks.withType(JavaCompile) {
    sourceSets.main.compileClasspath += configurations.providedCompile
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
    options.encoding = 'UTF-8'
    options.release = 21
}

run {
    classpath += configurations.providedCompile
}

test {
    finalizedBy jacocoTestReport
    classpath += configurations.providedCompile
    useJUnitPlatform()
    testLogging.showStandardStreams = true
}

startScripts {
  unixStartScriptGenerator.template = resources.text.fromFile(project.getRootDir().getAbsolutePath() + '/scripts/unixStartScript.txt')
  windowsStartScriptGenerator.template = resources.text.fromFile(project.getRootDir().getAbsolutePath() + '/scripts/windowsStartScript.txt')
}

application {
    mainClass = 'com.clouds42.Coverage41C'
}

jacocoTestReport {
    dependsOn test
}

buildConfig {
    className("BuildConfig")
    packageName("com.clouds42")
    buildConfigField("String", "APP_VERSION", "\"${project.version}\"")
    buildConfigField("long", "BUILD_TIME", "${System.currentTimeMillis()}L")
}

githubRelease {
    token(findProperty("github.token") ?: "")
    owner = "proDOOMman"
    repo = "Coverage41C"
    targetCommitish = "master"
    releaseAssets.from(distZip.archiveFile)
    dryRun = false
}

license {
    header = rootProject.file("HEADER.txt")

    ext["year"] = "2020-" + Calendar.getInstance().get(Calendar.YEAR)
    ext["name"] = "Kosolapov Stanislav aka proDOOMman <prodoomman@gmail.com>"
    ext["project"] = "Coverage41C"
    exclude("**/*.properties")
    exclude("**/*.xml")
    exclude("**/*.json")
    exclude("**/*.bsl")
    exclude("**/*.os")
    exclude("**/*.txt")
    exclude("**/*.java.orig")
    exclude("**/*.impl")
    exclude("**/BuildConfig.java")
    strictCheck = true
    mapping("java", "SLASHSTAR_STYLE")
}
